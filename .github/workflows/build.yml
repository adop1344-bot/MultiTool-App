name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Тип сборки'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Create debug keystore
        run: |
          if [ ! -f "keystore.jks" ]; then
            keytool -genkey -v -keystore keystore.jks -alias android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=MultiTool, OU=Dev, O=MultiTool, L=City, ST=State, C=RU"
          fi

      - name: Build with Gradle
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export GITHUB_RUN_NUMBER=${{ github.run_number }}
          if [ "$BUILD_TYPE" == "release" ]; then
            gradle assembleRelease
          else
            gradle assembleDebug
          fi

      - name: Prepare APK
        run: |
          mkdir -p release-apk
          find app/build/outputs/apk -name "*.apk" -exec cp {} release-apk/ \;
          ls -la release-apk/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "MultiTool v1.0.${{ github.run_number }}"
          body: |
            ## MultiTool v1.0.${{ github.run_number }}

            ### 25+ инструментов:
            🌐 **Сеть**: Ping, DNS, IP Info, Port Check, HTTP Check
            📝 **Текст**: Base64, URL, JSON, UUID, ROT13, Lorem Ipsum, Reverse
            🔄 **Конвертеры**: Color, Temperature, Length, Weight, Data
            🔑 **Shizuku**: Shell Console, System Info
            🔐 **Крипто**: MD5, SHA-1, SHA-256

            📥 Скачай APK ниже
          files: release-apk/*
          generate_release_notes: false
          make_latest: true
